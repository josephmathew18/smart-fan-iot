databases:
  - name: smart-fan-db
    databaseName: smart_fan_db
    user: smart_fan_user
    plan: free

services:
  - type: web
    name: smart-fan-iot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-fan-db
          property: connectionString
      - key: PORT
        value: 10000

