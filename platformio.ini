; ==============================================================================
; PlatformIO Project Configuration for Smart Fan IoT System (ESP32)
; ==============================================================================
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM9
monitor_port = COM9
build_src_filter = +<main.cpp> -<main_production.cpp>
build_flags = 
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4

